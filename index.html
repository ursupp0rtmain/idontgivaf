<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>idontgivaf.uk</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg:     #080808;
            --text:   #5a5a5a;
            --mid:    #888;
            --bright: #d0d0d0;
            --dim:    #2a2a2a;
            --red:    #cc2200;
        }

        html { scroll-behavior: auto; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── HERO ── */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            position: relative;
        }

        .site-id {
            font-size: 0.65rem;
            color: var(--dim);
            letter-spacing: 0.5em;
            text-transform: uppercase;
            margin-bottom: 5rem;
        }

        .counter-label {
            font-size: 0.6rem;
            color: var(--dim);
            letter-spacing: 0.7em;
            text-transform: uppercase;
            margin-bottom: 0.75rem;
        }

        #counter {
            font-size: clamp(7rem, 30vw, 22rem);
            font-weight: 700;
            color: var(--bright);
            line-height: 0.85;
            font-variant-numeric: tabular-nums;
            user-select: none;
            transition: color 0.15s, text-shadow 0.15s;
        }

        #counter.lit {
            color: var(--red);
            text-shadow: 0 0 80px rgba(204,34,0,0.35);
        }

        #counter.shake {
            animation: shake 0.45s ease;
        }

        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20%      { transform: translateX(-8px) rotate(-0.5deg); }
            40%      { transform: translateX(8px)  rotate( 0.5deg); }
            60%      { transform: translateX(-5px) rotate(-0.3deg); }
            80%      { transform: translateX(5px)  rotate( 0.3deg); }
        }

        #status {
            margin-top: 1.75rem;
            font-size: 0.75rem;
            color: var(--dim);
            letter-spacing: 0.2em;
            height: 1.1rem;
            opacity: 0;
            transition: opacity 0.4s;
        }

        #status.show { opacity: 1; }

        .scroll-hint {
            position: absolute;
            bottom: 2.5rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.58rem;
            color: var(--dim);
            letter-spacing: 0.35em;
            white-space: nowrap;
            animation: breathe 5s ease-in-out infinite;
        }

        @keyframes breathe {
            0%,100% { opacity: 0.15; }
            50%      { opacity: 0.45; }
        }

        /* ── FLEE BUTTON ── */
        #flee-btn {
            position: fixed;
            background: transparent;
            border: 1px solid var(--dim);
            color: var(--text);
            font-family: inherit;
            font-size: 0.7rem;
            letter-spacing: 0.25em;
            padding: 0.7rem 1.5rem;
            cursor: pointer;
            z-index: 99;
            transition: border-color 0.15s, color 0.15s;
            user-select: none;
            /* transition for smooth repositioning — intentionally absent */
        }

        #flee-btn:hover {
            border-color: var(--text);
        }

        #flee-btn:focus-visible {
            outline: 1px solid var(--red);
            outline-offset: 5px;
            border-color: var(--red);
            color: var(--mid);
        }

        /* ── VOID ── */
        #void {
            max-width: 540px;
            margin: 0 auto;
            padding: 0 2rem 8rem;
        }

        .void-line {
            padding: 1.25rem 0;
            border-top: 1px solid #131313;
            font-size: 0.72rem;
            color: var(--dim);
            letter-spacing: 0.1em;
            opacity: 0;
            transform: translateY(8px);
            animation: rise 0.55s forwards;
        }

        @keyframes rise {
            to { opacity: 1; transform: translateY(0); }
        }

        #sentinel { height: 1px; }

        /* ── SIGH OVERLAY ── */
        #sigh-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 200;
        }

        #sigh-msg {
            font-size: clamp(1rem, 3.5vw, 1.8rem);
            color: var(--mid);
            letter-spacing: 0.06em;
            text-align: center;
            padding: 1rem 2rem;
            max-width: 620px;
            opacity: 0;
            transform: scale(0.94);
            transition: opacity 0.3s, transform 0.3s;
        }

        #sigh-msg.show {
            opacity: 1;
            transform: scale(1);
        }

        /* ── CURSOR CROSSHAIR ── */
        body.hunt { cursor: crosshair; }
    </style>
</head>
<body>

<section class="hero">
    <p class="site-id">idontgivaf.uk</p>
    <p class="counter-label">gegebene f*cks</p>
    <div id="counter">0</div>
    <p id="status"></p>
    <p class="scroll-hint">↓ &nbsp; hier unten ist auch nichts &nbsp; ↓</p>
</section>

<div id="void"></div>
<div id="sentinel"></div>

<button id="flee-btn" aria-label="Einen F*ck geben">einen f*ck geben</button>

<div id="sigh-overlay">
    <p id="sigh-msg"></p>
</div>

<script>
'use strict';

// ── UTIL ──────────────────────────────────────────────────────────────────
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const wait = ms  => new Promise(r => setTimeout(r, ms));

// ── FLEE BUTTON ───────────────────────────────────────────────────────────
const btn = document.getElementById('flee-btn');
let fleeTimeout = null;

function safePos() {
    const pw = btn.offsetWidth  + 24;
    const ph = btn.offsetHeight + 24;
    return {
        x: 24 + Math.random() * Math.max(40, window.innerWidth  - pw - 48),
        y: 24 + Math.random() * Math.max(40, window.innerHeight - ph - 48)
    };
}

function flee() {
    const { x, y } = safePos();
    btn.style.left = x + 'px';
    btn.style.top  = y + 'px';
}

flee(); // initial placement

// Mouse proximity detection
document.addEventListener('mousemove', e => {
    if (fleeTimeout) return;
    const r  = btn.getBoundingClientRect();
    const cx = r.left + r.width  / 2;
    const cy = r.top  + r.height / 2;
    const d  = Math.hypot(e.clientX - cx, e.clientY - cy);
    if (d < 140) {
        flee();
        fleeTimeout = setTimeout(() => { fleeTimeout = null; }, 40);
    }
}, { passive: true });

// Also flee on touch proximity — slightly less aggressive so mobile users can trigger easter egg
document.addEventListener('touchmove', e => {
    const touch = e.touches[0];
    const r  = btn.getBoundingClientRect();
    const cx = r.left + r.width  / 2;
    const cy = r.top  + r.height / 2;
    const d  = Math.hypot(touch.clientX - cx, touch.clientY - cy);
    if (d < 60) flee();
}, { passive: true });

window.addEventListener('resize', flee);

// ── AUDIO SIGH (synthesized, no external files) ───────────────────────────
function playSigh() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const t   = ctx.currentTime;
        const dur = 1.9;

        // — breath layer (filtered white noise) —
        const bufLen = ctx.sampleRate * dur;
        const buf    = ctx.createBuffer(1, bufLen, ctx.sampleRate);
        const data   = buf.getChannelData(0);
        for (let i = 0; i < bufLen; i++) data[i] = Math.random() * 2 - 1;

        const noise = ctx.createBufferSource();
        noise.buffer = buf;

        const bpf = ctx.createBiquadFilter();
        bpf.type = 'bandpass';
        bpf.frequency.setValueAtTime(2200, t);
        bpf.frequency.exponentialRampToValueAtTime(600, t + dur);
        bpf.Q.value = 0.6;

        const ng = ctx.createGain();
        ng.gain.setValueAtTime(0, t);
        ng.gain.linearRampToValueAtTime(0.18, t + 0.12);
        ng.gain.setValueAtTime(0.18, t + 0.5);
        ng.gain.linearRampToValueAtTime(0, t + dur);

        noise.connect(bpf); bpf.connect(ng); ng.connect(ctx.destination);
        noise.start(t); noise.stop(t + dur);

        // — vocal "ugh" layer (descending sine) —
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(240, t + 0.08);
        osc.frequency.linearRampToValueAtTime(190, t + 0.4);
        osc.frequency.linearRampToValueAtTime(130, t + dur * 0.75);

        const og = ctx.createGain();
        og.gain.setValueAtTime(0, t);
        og.gain.linearRampToValueAtTime(0.09, t + 0.18);
        og.gain.setValueAtTime(0.09, t + 0.45);
        og.gain.linearRampToValueAtTime(0, t + dur * 0.75);

        osc.connect(og); og.connect(ctx.destination);
        osc.start(t + 0.08); osc.stop(t + dur);

    } catch (_) { /* no audio support, silently fail */ }
}

// ── EASTER EGG ────────────────────────────────────────────────────────────
const counter  = document.getElementById('counter');
const statusEl = document.getElementById('status');
const sighMsg  = document.getElementById('sigh-msg');
let eggActive  = false;

const SIGHS = [
    '*seufz* ...',
    'bitte. nicht.',
    'oh nein. oh nein nein nein.',
    'das war ein versehen. korrigiere.',
    'kurz unachtsam gewesen. entschuldigung.',
    'system.exe hat versagt.',
    'das hätte nicht passieren sollen.',
    'f*ck.dll: unexpected value 1',
];

const REVERTS = [
    '— uff, zu anstrengend.',
    '— fehler behoben. danke für nichts.',
    '— f*ck zurückgezogen. wie immer.',
    '— war nichts. wie alles hier.',
    '— zähler korrigiert. bitte gehst du jetzt.',
    '— ausgabe storniert. rückerstattung: 0 f*cks.',
];

function shakeCounter() {
    counter.classList.remove('shake');
    void counter.offsetWidth; // reflow to restart animation
    counter.classList.add('shake');
}

async function easterEgg() {
    if (eggActive) return;
    eggActive = true;
    flee(); // button panics

    // Counter hits 1
    counter.textContent = '1';
    counter.classList.add('lit');
    shakeCounter();

    playSigh();

    sighMsg.textContent = pick(SIGHS);
    sighMsg.classList.add('show');

    await wait(2100);

    sighMsg.classList.remove('show');
    await wait(380);

    // Revert to 0
    counter.classList.remove('lit');
    counter.textContent = '0';
    shakeCounter();

    statusEl.textContent = pick(REVERTS);
    statusEl.classList.add('show');

    await wait(3800);
    statusEl.classList.remove('show');
    await wait(450);
    statusEl.textContent = '';

    eggActive = false;
}

btn.addEventListener('click', easterEgg);

// ── INFINITE VOID ─────────────────────────────────────────────────────────
const voidEl   = document.getElementById('void');
const sentinel = document.getElementById('sentinel');

const NOTHING = [
    'hier unten ist auch nichts.',
    'warum scrollst du noch?',
    'geh weg.',
    'lass mich in ruhe.',
    'hier ist wirklich nichts.',
    'du verschwendest deine kostbare lebenszeit.',
    'der inhalt kommt gleich.  (nein.)',
    '404: bedeutung nicht gefunden.',
    'weiter unten wird es besser.  (wird es nicht.)',
    '...',
    'ich meine es ernst.',
    'stop.',
    'nein.',
    'wirklich? immer noch?',
    'okay, ich respektiere die ausdauer. aber: nein.',
    'die leere ist unendlich. du nicht.',
    '// TODO: inhalt hinzufügen  ← (nie erledigt)',
    'error 000: zu viel nichts.',
    'NULL',
    'undefined',
    'NaN',
    '> _',
    'der server gähnt.',
    'der entwickler schläft.',
    'der designer hat die kündigung eingereicht.',
    'du bist jetzt hartnäckiger als der knopf.',
    'glückwunsch. dein preis: noch mehr nichts.',
    'hier hätte werbung gestanden. aber wen interessiert das.',
    '§ 42 abs. 0 nichtigkeitsgesetz: hier ist nichts.',
    'loading...   just kidding.',
    'vielleicht ist genau das die botschaft.',
    'vielleicht auch nicht. wahrscheinlich nicht.',
    'philosophisch betrachtet: sehr konsequent.',
    'du kannst nicht gewinnen.',
    'du kannst noch nicht mal verlieren. dafür müsste es etwas geben.',
    'kein inhalt wurde bei diesen dreharbeiten verletzt.',
    'here there be dragons.  (there aren\'t.)',
    'die seite wächst. der sinn schrumpft.',
    'beende dieses leiden. schließe den tab.',
    'auf dieser ebene ist alles gleich: leer.',
    'bitte scrolle nach oben. ist genauso sinnlos, aber kürzer.',
    'du hast [redacted] sekunden deines lebens verschwendet.',
    'die leere grüßt zurück.',
    'irgendwo da oben ist der knopf. er fragt sich, was du hier suchst.',
    'echo "sinn" → command not found',
    'rm -rf ./bedeutung  →  nothing to remove',
    'ping existenz  →  request timeout',
];

let lineIdx = 0;
let busy    = false;

function addLines(n = 8) {
    if (busy) return;
    busy = true;
    const frag = document.createDocumentFragment();
    for (let i = 0; i < n; i++) {
        const p = document.createElement('p');
        p.className = 'void-line';
        p.style.animationDelay = (i * 55) + 'ms';
        p.textContent = NOTHING[lineIdx % NOTHING.length];
        frag.appendChild(p);
        lineIdx++;
    }
    voidEl.appendChild(frag);
    busy = false;
}

const obs = new IntersectionObserver(entries => {
    if (entries[0].isIntersecting) addLines(9);
}, { rootMargin: '400px' });

obs.observe(sentinel);
</script>
</body>
</html>
