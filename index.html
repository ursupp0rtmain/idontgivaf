<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>idontgivaf.uk</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg:     #080808;
            --text:   #a6a6a6;
            --mid:    #cfcfcf;
            --bright: #f0f0f0;
            --dim:    #6f6f6f;
            --red:    #ff4a2d;
        }

        html { scroll-behavior: auto; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace;
            line-height: 1.5;
            min-height: 100vh;
            overflow-x: hidden;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }

        /* ── HERO ── */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            position: relative;
        }

        .site-id {
            font-size: 0.72rem;
            color: var(--dim);
            letter-spacing: 0.32em;
            text-transform: uppercase;
            margin-bottom: 5rem;
        }

        .counter-label {
            font-size: 0.72rem;
            color: var(--dim);
            letter-spacing: 0.36em;
            text-transform: uppercase;
            margin-bottom: 0.75rem;
        }

        #counter {
            font-size: clamp(7rem, 30vw, 22rem);
            font-weight: 700;
            color: var(--bright);
            line-height: 0.85;
            font-variant-numeric: tabular-nums;
            user-select: none;
            transition: color 0.15s, text-shadow 0.15s;
        }

        #counter.lit {
            color: var(--red);
            text-shadow: 0 0 80px rgba(204,34,0,0.35);
        }

        #counter.shake {
            animation: shake 0.45s ease;
        }

        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20%      { transform: translateX(-8px) rotate(-0.5deg); }
            40%      { transform: translateX(8px)  rotate( 0.5deg); }
            60%      { transform: translateX(-5px) rotate(-0.3deg); }
            80%      { transform: translateX(5px)  rotate( 0.3deg); }
        }

        #status {
            margin-top: 1.75rem;
            font-size: 0.9rem;
            color: var(--dim);
            letter-spacing: 0.08em;
            min-height: 1.35rem;
            opacity: 0;
            transition: opacity 0.4s;
        }

        #status.show { opacity: 1; }

        .scroll-hint {
            position: absolute;
            bottom: 2.5rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.68rem;
            color: var(--dim);
            letter-spacing: 0.12em;
            white-space: nowrap;
            animation: breathe 5s ease-in-out infinite;
        }

        @keyframes breathe {
            0%,100% { opacity: 0.15; }
            50%      { opacity: 0.45; }
        }

        /* ── FLEE BUTTON ── */
        #flee-btn {
            position: fixed;
            background: transparent;
            border: 1px solid var(--dim);
            color: var(--text);
            font-family: inherit;
            font-size: 0.78rem;
            letter-spacing: 0.12em;
            padding: 0.7rem 1.5rem;
            cursor: pointer;
            z-index: 99;
            transition: border-color 0.15s, color 0.15s;
            user-select: none;
            /* transition for smooth repositioning — intentionally absent */
        }

        #flee-btn:hover {
            border-color: var(--text);
        }

        #flee-btn:focus-visible {
            outline: 1px solid var(--red);
            outline-offset: 5px;
            border-color: var(--red);
            color: var(--mid);
        }

        /* ── VOID ── */
        #void {
            max-width: 680px;
            margin: 0 auto;
            padding: 0 2rem 8rem;
        }

        .void-line {
            padding: 1.25rem 0;
            border-top: 1px solid #131313;
            font-size: 0.86rem;
            color: var(--text);
            letter-spacing: 0.03em;
            line-height: 1.8;
            opacity: 0;
            transform: translateY(8px);
            animation: rise 0.55s forwards;
        }

        @keyframes rise {
            to { opacity: 1; transform: translateY(0); }
        }

        #sentinel { height: 1px; }

        /* ── SIGH OVERLAY ── */
        #sigh-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 200;
        }

        #sigh-msg {
            font-size: clamp(1rem, 3.5vw, 1.8rem);
            color: var(--mid);
            letter-spacing: 0.06em;
            text-align: center;
            padding: 1rem 2rem;
            max-width: 620px;
            opacity: 0;
            transform: scale(0.94);
            transition: opacity 0.3s, transform 0.3s;
        }

        #sigh-msg.show {
            opacity: 1;
            transform: scale(1);
        }

        /* ── CURSOR CROSSHAIR ── */
        body.hunt { cursor: crosshair; }
    </style>
</head>
<body>

<section class="hero">
    <p class="site-id">idontgivaf.uk</p>
    <p class="counter-label">f*cks given</p>
    <div id="counter">0</div>
    <p id="status"></p>
    <p class="scroll-hint">↓ &nbsp; there is nothing down here either &nbsp; ↓</p>
</section>

<div id="void"></div>
<div id="sentinel"></div>

<button id="flee-btn" aria-label="Give a f*ck">give a f*ck</button>

<div id="sigh-overlay">
    <p id="sigh-msg"></p>
</div>

<script>
'use strict';

// ── UTIL ──────────────────────────────────────────────────────────────────
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const wait = ms  => new Promise(r => setTimeout(r, ms));

// ── FLEE BUTTON ───────────────────────────────────────────────────────────
const btn = document.getElementById('flee-btn');
let fleeTimeout = null;

function safePos() {
    const pw = btn.offsetWidth  + 24;
    const ph = btn.offsetHeight + 24;
    return {
        x: 24 + Math.random() * Math.max(40, window.innerWidth  - pw - 48),
        y: 24 + Math.random() * Math.max(40, window.innerHeight - ph - 48)
    };
}

function flee() {
    const { x, y } = safePos();
    btn.style.left = x + 'px';
    btn.style.top  = y + 'px';
}

flee(); // initial placement

// Mouse proximity detection
document.addEventListener('mousemove', e => {
    if (fleeTimeout) return;
    const r  = btn.getBoundingClientRect();
    const cx = r.left + r.width  / 2;
    const cy = r.top  + r.height / 2;
    const d  = Math.hypot(e.clientX - cx, e.clientY - cy);
    if (d < 140) {
        flee();
        fleeTimeout = setTimeout(() => { fleeTimeout = null; }, 40);
    }
}, { passive: true });

// Also flee on touch proximity — slightly less aggressive so mobile users can trigger easter egg
document.addEventListener('touchmove', e => {
    const touch = e.touches[0];
    const r  = btn.getBoundingClientRect();
    const cx = r.left + r.width  / 2;
    const cy = r.top  + r.height / 2;
    const d  = Math.hypot(touch.clientX - cx, touch.clientY - cy);
    if (d < 60) flee();
}, { passive: true });

window.addEventListener('resize', flee);

// ── AUDIO SIGH (synthesized, no external files) ───────────────────────────
function playSigh() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const t   = ctx.currentTime;
        const dur = 1.9;

        // — breath layer (filtered white noise) —
        const bufLen = ctx.sampleRate * dur;
        const buf    = ctx.createBuffer(1, bufLen, ctx.sampleRate);
        const data   = buf.getChannelData(0);
        for (let i = 0; i < bufLen; i++) data[i] = Math.random() * 2 - 1;

        const noise = ctx.createBufferSource();
        noise.buffer = buf;

        const bpf = ctx.createBiquadFilter();
        bpf.type = 'bandpass';
        bpf.frequency.setValueAtTime(2200, t);
        bpf.frequency.exponentialRampToValueAtTime(600, t + dur);
        bpf.Q.value = 0.6;

        const ng = ctx.createGain();
        ng.gain.setValueAtTime(0, t);
        ng.gain.linearRampToValueAtTime(0.18, t + 0.12);
        ng.gain.setValueAtTime(0.18, t + 0.5);
        ng.gain.linearRampToValueAtTime(0, t + dur);

        noise.connect(bpf); bpf.connect(ng); ng.connect(ctx.destination);
        noise.start(t); noise.stop(t + dur);

        // — vocal "ugh" layer (descending sine) —
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(240, t + 0.08);
        osc.frequency.linearRampToValueAtTime(190, t + 0.4);
        osc.frequency.linearRampToValueAtTime(130, t + dur * 0.75);

        const og = ctx.createGain();
        og.gain.setValueAtTime(0, t);
        og.gain.linearRampToValueAtTime(0.09, t + 0.18);
        og.gain.setValueAtTime(0.09, t + 0.45);
        og.gain.linearRampToValueAtTime(0, t + dur * 0.75);

        osc.connect(og); og.connect(ctx.destination);
        osc.start(t + 0.08); osc.stop(t + dur);

    } catch (_) { /* no audio support, silently fail */ }
}

// ── EASTER EGG ────────────────────────────────────────────────────────────
const counter  = document.getElementById('counter');
const statusEl = document.getElementById('status');
const sighMsg  = document.getElementById('sigh-msg');
let eggActive  = false;

const SIGHS = [
    '*sigh* ...',
    'please. no.',
    'oh no. oh no no no.',
    'that was a mistake. correcting.',
    'brief lapse in judgment. sorry.',
    'system.exe has failed.',
    'that should not have happened.',
    'f*ck.dll: unexpected value 1',
];

const REVERTS = [
    '-- ugh, too much effort.',
    '-- bug fixed. thanks for nothing.',
    '-- f*ck withdrawn. as usual.',
    '-- never mind. like everything here.',
    '-- counter corrected. please leave now.',
    '-- output canceled. refund: 0 f*cks.',
];

function shakeCounter() {
    counter.classList.remove('shake');
    void counter.offsetWidth; // reflow to restart animation
    counter.classList.add('shake');
}

async function easterEgg() {
    if (eggActive) return;
    eggActive = true;
    flee(); // button panics

    // Counter hits 1
    counter.textContent = '1';
    counter.classList.add('lit');
    shakeCounter();

    playSigh();

    sighMsg.textContent = pick(SIGHS);
    sighMsg.classList.add('show');

    await wait(2100);

    sighMsg.classList.remove('show');
    await wait(380);

    // Revert to 0
    counter.classList.remove('lit');
    counter.textContent = '0';
    shakeCounter();

    statusEl.textContent = pick(REVERTS);
    statusEl.classList.add('show');

    await wait(3800);
    statusEl.classList.remove('show');
    await wait(450);
    statusEl.textContent = '';

    eggActive = false;
}

btn.addEventListener('click', easterEgg);

// ── INFINITE VOID ─────────────────────────────────────────────────────────
const voidEl   = document.getElementById('void');
const sentinel = document.getElementById('sentinel');

const NOTHING = [
    'there is nothing down here either.',
    'why are you still scrolling?',
    'go away.',
    'leave me alone.',
    'there is really nothing here.',
    'you are wasting precious life.',
    'content is loading soon.  (no.)',
    '404: meaning not found.',
    'it gets better further down.  (it does not.)',
    '...',
    'I mean it.',
    'stop.',
    'no.',
    'really? still?',
    'okay, I respect the stamina. but: no.',
    'the void is infinite. you are not.',
    '// TODO: add content  <- (never done)',
    'error 000: too much nothing.',
    'NULL',
    'undefined',
    'NaN',
    '> _',
    'the server yawns.',
    'the developer is asleep.',
    'the designer has resigned.',
    'you are now more persistent than the button.',
    'congratulations. your prize: even more nothing.',
    'there would have been an ad here. but who cares.',
    'section 42, paragraph 0 of the nullity act: nothing is here.',
    'loading...   just kidding.',
    'maybe this is exactly the message.',
    'maybe not. probably not.',
    'philosophically speaking: very consistent.',
    'you cannot win.',
    'you cannot even lose. that would require something to exist.',
    'no content was harmed in the making of this page.',
    'here there be dragons.  (there aren\'t.)',
    'the page grows. the meaning shrinks.',
    'end this suffering. close the tab.',
    'on this level, everything is equally empty.',
    'please scroll back up. just as pointless, but shorter.',
    'you have wasted [redacted] seconds of your life.',
    'the void says hello back.',
    'somewhere up there is the button. it wonders what you are looking for.',
    'echo "meaning" -> command not found',
    'rm -rf ./meaning  ->  nothing to remove',
    'ping existence  ->  request timeout',
];

let lineIdx = 0;
let busy    = false;

function addLines(n = 8) {
    if (busy) return;
    busy = true;
    const frag = document.createDocumentFragment();
    for (let i = 0; i < n; i++) {
        const p = document.createElement('p');
        p.className = 'void-line';
        p.style.animationDelay = (i * 55) + 'ms';
        p.textContent = NOTHING[lineIdx % NOTHING.length];
        frag.appendChild(p);
        lineIdx++;
    }
    voidEl.appendChild(frag);
    busy = false;
}

const obs = new IntersectionObserver(entries => {
    if (entries[0].isIntersecting) addLines(9);
}, { rootMargin: '400px' });

obs.observe(sentinel);
</script>
</body>
</html>
